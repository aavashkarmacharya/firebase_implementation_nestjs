<!doctype html>
<html>
  <head>
    <title>Get FCM Token</title>
  </head>
  <body>
    <h1>Get Your FCM Token</h1>
    <button id="getToken" style="padding: 10px 20px; font-size: 16px">
      Get FCM Token
    </button>
    <p id="result" style="margin-top: 20px; font-family: monospace"></p>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
      import {
        getMessaging,
        getToken,
      } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging.js';

      const firebaseConfig = {
        apiKey: 'AIzaSyCXq2xOTtTswEcedIMmSwzauNhNMBHLHqo',
        authDomain: 'marketplace-6cb8b.firebaseapp.com',
        projectId: 'marketplace-6cb8b',
        storageBucket: 'marketplace-6cb8b.firebasestorage.app',
        messagingSenderId: '239763128246',
        appId: '1:239763128246:web:bcf6037986534251400b17',
        measurementId: 'G-WSCMJDJ1DB',
      };

      const app = initializeApp(firebaseConfig);
      const messaging = getMessaging(app);

      document
        .getElementById('getToken')
        .addEventListener('click', async () => {
          try {
            // First register the service worker
            const registration = await navigator.serviceWorker.register(
              '/firebase-messaging-sw.js',
            );
            console.log('Service Worker registered:', registration);

            // Wait for it to be active
            await navigator.serviceWorker.ready;
            console.log('Service Worker ready!');

            const permission = await Notification.requestPermission();
            console.log('Permission:', permission);

            if (permission === 'granted') {
              const token = await getToken(messaging, {
                vapidKey:
                  'BOuBlbEb30ZZ6ajP3gJlMwO6xEGMmGcK2aAKFb4wHLfnJO54z2blMr5xMjGOpnZOhWm2AdWO_95lzvE09W3ZOpQ', // Replace with your NEW key!
                serviceWorkerRegistration: registration,
              });

              document.getElementById('result').innerHTML = `
                <strong>Token (click to copy):</strong><br>
                <textarea readonly style="width: 100%; height: 100px;">${token}</textarea>
              `;

              navigator.clipboard.writeText(token);
              alert('✅ Token copied to clipboard!');
              console.log('FCM Token:', token);
            } else {
              document.getElementById('result').textContent =
                '❌ Notification permission denied';
            }
          } catch (error) {
            document.getElementById('result').textContent =
              '❌ Error: ' + error.message;
            console.error('Full error:', error);
          }
        });
    </script>
  </body>
</html>
